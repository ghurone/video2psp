name: Publish to PyPI

# Runs when a version tag is pushed: git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs the tags to compute the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: python -m pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
